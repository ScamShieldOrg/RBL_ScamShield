# ==============================================================================
# Consensus & Decision Engine Thresholds (Standardized 3-Label Framework)
# Labels: SCAM-RISK (High/Critical) | LOW-RISK (Legitimate) | UNKNOWN (Ambiguous)
# ==============================================================================
consensus_rules:
  scam_risk_threshold: 0.60         # Score >= 0.60 -> SCAM-RISK
  low_risk_threshold: 0.40          # Score < 0.40 -> LOW-RISK
  unknown_range: [0.40, 0.60]       # 0.40 <= Score < 0.60 -> UNKNOWN
  unanimous_scam_threshold: 0.85    # Score >= 0.85 -> CRITICAL Risk
  suspected_scam_threshold: 0.60    # Score >= 0.60 -> HIGH Risk
  ham_threshold: 0.40               # Score < 0.40 -> LOW Risk
  public_defender_veto_boost: 0.25  # Subtracted from scam score if Defender strongly asserts legitimacy with valid protocol
  unknown_triggers:
    vote_contradiction_enabled: true
    min_supermajority_margin: 2
